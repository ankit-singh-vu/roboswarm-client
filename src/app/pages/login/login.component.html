<div class="account-pages"></div>
<div class="clearfix"></div>
<div class="app-login wrapper-page">
  <div class="text-center">
    <a href="/" class="logo" alt="Roboswarm">
      <img src="/assets/images/roboswarm_transparent.png" />
    </a>
  </div>
  <div class="m-t-40 card-box">
    <div class="text-center">
      <h4 class="text-uppercase font-bold mb-0">Login</h4>
    </div>
    <div class="p-20">
      <form class="form-horizontal m-t-20" #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
        <div class="form-group mb-3">
          <div class="col-xs-12">
            <input class="form-control"
                   type="email"
                   name="email"
                   required
                   [(ngModel)]="model.email"
                   [disabled]="submitted"
                   placeholder="Email">
          </div>
        </div>
        <div class="form-group">
          <div class="col-xs-12">
            <input class="form-control"
                   type="password"
                   name="password"
                   required
                   [(ngModel)]="model.password"
                   [disabled]="submitted"
                   placeholder="Password">
          </div>
        </div>
        <div class="form-group text-center m-t-40 mb-0">
          <div class="col-xs-12 d-grid">
            <button class="btn btn-custom btn-bordred btn-block waves-effect waves-light"
                    type="submit"
                    [disabled]="submitted || !allFieldsCompleted()">
              Login
            </button>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-12 text-center">
            <div *ngIf='error !== ""' class="alert alert-danger" role="alert">
              {{ error }}
            </div>
            <p class="text-muted exit first">Don't have account?<a [routerLink]="['/auth/register']"
                class="text-primary m-l-5"><b>Register</b></a></p>
            <p class="text-muted exit">Forgot your password?<a [routerLink]="['/auth/password-reset']"
                class="text-primary m-l-5"><b>Reset it</b></a></p>
          </div>
        </div>

      </form>

    </div>
  </div>
  <!-- end card-box -->
</div>
