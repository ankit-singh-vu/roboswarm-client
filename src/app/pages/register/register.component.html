<div class="account-pages"></div>
<div class="clearfix"></div>
<div class="app-register wrapper-page">
  <div class="text-center">
    <a href="index.html" class="logo"><span>Robo<span>Swarm</span></span></a>
    <h5 class="text-muted mt-0 font-600">Locust Performance and Load Testing</h5>
  </div>
  <div class="m-t-40 card-box">
    <div class="text-center">
      <h4 class="text-uppercase font-bold mb-0">Register</h4>
    </div>
    <div class="p-20">
      <form class="form-horizontal m-t-20" #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
        <div class="form-group">
          <div class="col-xs-12">
            <input class="form-control"
                   type="email"
                   name="email"
                   required
                   [(ngModel)]="model.email"
                   [disabled]="submitted"
                   placeholder="Email">
          </div>
        </div>
        <div class="form-group">
          <div class="col-xs-12">
            <input class="form-control"
                   type="password"
                   name="password"
                   required
                   [(ngModel)]="model.password"
                   [disabled]="submitted"
                   placeholder="Password">
          </div>
        </div>
        <div class="form-group">
          <div class="col-xs-12">
            <input class="form-control"
                   type="text"
                   name="first_name"
                   required
                   [(ngModel)]="model.first_name"
                   [disabled]="submitted"
                   placeholder="First Name">
          </div>
        </div>
        <div class="form-group">
          <div class="col-xs-12">
            <input class="form-control"
                   type="text"
                   name="last_name"
                   required
                   [(ngModel)]="model.last_name"
                   [disabled]="submitted"
                   placeholder="Last Name">
          </div>
        </div>

        <div class="form-group text-center m-t-40 mb-0">
          <div class="col-xs-12">
            <button class="btn btn-custom btn-bordred btn-block waves-effect waves-light"
                    type="submit"
                    [disabled]="submitted || !allFieldsCompleted()">
              Register
            </button>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-12 text-center">
            <div *ngIf='error !== ""' class="alert alert-danger" role="alert">
              {{ error }}
            </div>
            <p class="text-muted">Already have account?<a href="page-login.html"
                class="text-primary m-l-5"><b>Sign In</b></a></p>
          </div>
        </div>

      </form>

    </div>
  </div>
  <!-- end card-box -->
</div>>
